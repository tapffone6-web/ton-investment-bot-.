<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة استثمار TON</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .header {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .balance {
            font-size: 26px;
            font-weight: bold;
            color: #4ade80;
            margin-top: 5px;
        }
        .plan-card {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #334155;
        }
        .plan-title {
            font-size: 18px;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .plan-details {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:active { background-color: #006699; }
    </style>
</head>
<body>

    <div class="container">
        <!-- رأس الحساب والمحفظة -->
        <div class="header">
            <div>رصيد الاستثمار النشط</div>
            <div class="balance" id="balance">5.00 TON</div>
        </div>

        <!-- الخطة الأولى -->
        <div class="plan-card">
            <div class="plan-title">🚀 خطة النمو السريع</div>
            <div class="plan-details">العائد: 15% يومياً لمدة 10 أيام<br>الحد الأدنى: 1 TON</div>
            <button onclick="investPlan(1, 1)">استثمار 1 TON</button>
        </div>

        <!-- الخطة الثانية -->
        <div class="plan-card">
            <div class="plan-title">💎 خطة الحيتان الكبرى</div>
            <div class="plan-details">العائد: 30% يومياً لمدة 7 أيام<br>الحد الأدنى: 5 TON</div>
            <button onclick="investPlan(5, 2)">استثمار 5 TON</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = parseFloat(localStorage.getItem('inv_balance')) || 5.00;
        document.getElementById('balance').innerText = balance.toFixed(2) + ' TON';

        function investPlan(amount, planId) {
            if (balance >= amount) {
                balance -= amount;
                document.getElementById('balance').innerText = balance.toFixed(2) + ' TON';
                localStorage.setItem('inv_balance', balance);
                
                alert('تم تفعيل خطة الاستثمار بنجاح! سيتم إضافة الأرباح لمحفظتك قريباً.');
                
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            } else {
                alert('رصيدك غير كافٍ للاستثمار!');
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
            }
        }
    </script>
</body>
</html>
