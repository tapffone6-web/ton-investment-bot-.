<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make TON Mining & Investment</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h1 { color: #38bdf8; font-size: 24px; }
        .balance-card {
            background: #334155;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 20px;
            font-weight: bold;
        }
        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.98); background: #0369a1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💎 منصة تعدين TON</h1>
        <p>مرحباً بك في لوحة تحكم استثمارك وتعدينك اليومي.</p>
        
        <div class="balance-card">
            رصيدك: <span id="balance">0.00</span> TON
        </div>

        <button class="btn" onclick="mineToken()">🚀 اضغط للتعدين وزيادة الأرباح</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 0.00;
        function mineToken() {
            balance += 0.05;
            document.getElementById('balance').innerText = balance.toFixed(2);
            if (window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
        }
    </script>
</body>
</html>
